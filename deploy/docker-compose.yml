services:
  life-redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: life-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "1.0"
    volumes:
      - redis_data:/data
    networks: [oa_oa]
  life-backend:
    build: ../backend
    container_name: life-backend
    restart: unless-stopped
    env_file: ../backend/.env
    depends_on:
      life-redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 40s
    mem_limit: 1g
    cpus: "2.0"
    networks: [oa_oa]
    volumes:
      - ../backend/uploads:/app/uploads
  life-web:
    build: ../web
    container_name: life-web
    restart: unless-stopped
    depends_on:
      life-backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports: ["8080:80"]
    mem_limit: 256m
    cpus: "1.0"
    networks: [oa_oa]
networks:
  oa_oa:
    external: true
volumes:
  redis_data:
