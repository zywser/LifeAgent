services:
  mysql:
    image: mysql:8
    env_file: ../backend/.env
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis/redis-stack:latest
    ports: ["6379:6379"]
  backend:
    build: ../backend
    env_file: ../backend/.env
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["8000:8000"]
    volumes: ["../backend/uploads:/app/uploads"]
  web:
    build: ../web
    depends_on: [backend]
    ports: ["80:80"]
volumes:
  mysql_data:
