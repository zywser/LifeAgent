services:
  redis:
    image: redis/redis-stack:latest
    volumes:
      - redis_data:/data
    networks: [oa_oa]
  backend:
    build: ../backend
    env_file: ../backend/.env
    depends_on:
      redis: {condition: service_started}
    networks: [oa_oa]
    volumes:
      - ../backend/uploads:/app/uploads
  web:
    build: ../web
    depends_on: [backend]
    ports: ["8080:80"]
    networks: [oa_oa]
networks:
  oa_oa:
    external: true
volumes:
  redis_data: