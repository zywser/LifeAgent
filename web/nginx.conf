server {
    listen 80;
    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    # 独立访问（http://IP:8080 直达）：前端资源不带前缀
    location / {
        try_files $uri $uri/ /index.html;
    }
    # OA 同域 /life/ 前缀保留方案：静态资源映射
    location /life/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }
    # API 代理（独立部署：/api 直达；OA 剥离 /life 后也是 /api）
    location /api/ {
        proxy_pass http://life-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # OA 保留 /life 前缀方案：/life/api 直达后端
    location /life/api/ {
        proxy_pass http://life-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
